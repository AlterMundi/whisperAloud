<!-- Dedicated dbus-daemon config for this repo's "private" test buses
     (scripts/test_private_bus.sh, used by scripts/test_e2e.sh,
     scripts/test_gui.sh, and `-m dbus_private`).

     Incident: a plain `dbus-run-session` (with no config-file flag) uses
     the system default /usr/share/dbus-1/session.conf, which includes
     <standard_session_servicedirs/>. That directive makes the new,
     supposedly throwaway bus scan XDG_DATA_DIRS for *.service activation
     files, which, on a machine where the real WhisperAloud Flatpak is
     installed, includes
     ~/.local/share/flatpak/exports/share/dbus-1/services/org.fede.whisperaloud.service
     (Exec=flatpak run ... with a daemon flag). The first
     `bus.get("org.fede.whisperaloud")` against the "private" bus then
     D-Bus activates the real, maintainer's installed app, against the real
     $HOME, with the real microphone and clipboard, not anything this test
     harness spawned. That happened once already and left an orphaned
     real-app daemon behind.

     This config intentionally has NO <standard_session_servicedirs/>, NO
     <servicedir>, and NO <includedir>/<include> of any system or user
     location. Nothing is activatable on a bus started with this file;
     every daemon the e2e harness talks to is spawned directly via
     subprocess.Popen (see tests/e2e/conftest.py's `daemon` fixture), never
     by D-Bus activation. The one test that does need to exercise real
     D-Bus activation of our own daemon (tests/e2e/test_dbus_activation.py)
     deliberately starts its own second, nested dbus-run-session with its
     own throwaway <servicedir> pointing at a tmp_path activation file for
     the worktree's own `python -m whisper_aloud` (daemon mode), never at
     this outer bus, and never at flatpak.

     Keep this file in sync with tests/test_private_bus_dbus_config.py,
     which asserts on its contents. -->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>

  <!-- Deliberately no standard_session_servicedirs, servicedir,
       includedir, or include: nothing is activatable on this bus. -->

  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>

  <limit name="service_start_timeout">20000</limit>
</busconfig>
